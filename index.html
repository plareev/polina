<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Для тебя, заяц ♥</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
:root{--rose:#d6336c;--cream:#fff6ee;--ink:#5a2236;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden}
body{background:linear-gradient(160deg,#ffb3d1 0%,#ff7eb0 45%,#d6336c 100%);color:#fff;
font-family:"Playfair Display",Georgia,serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.screen,.fp,.fp *,.env,.env *,#mus{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.fp svg{pointer-events:none}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity .9s,transform .9s}
.hide{opacity:0;pointer-events:none;transform:scale(1.05)}
.fl{position:fixed;bottom:-40px;opacity:0;animation:up linear forwards;pointer-events:none;z-index:0;color:#fff}
@keyframes up{10%{opacity:.85}100%{transform:translateY(-115vh) rotate(25deg);opacity:0}}
h1{font-style:italic;font-weight:500;font-size:clamp(30px,9vw,46px);margin:0 0 8px;text-shadow:0 2px 12px rgba(150,20,70,.35)}
.script{font-family:Caveat,"Segoe Script",cursive;font-size:30px;color:#fff3f8}
.hint{opacity:.9;font-size:15px;margin-top:26px;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.4}}
.fp{position:relative;width:150px;height:150px;margin-top:34px;border-radius:50%;border:0;background:rgba(255,255,255,.22);
box-shadow:0 0 40px rgba(255,255,255,.5);touch-action:none;color:#fff;cursor:pointer;transition:transform .2s}
.fp svg{position:absolute;inset:0;width:100%;height:100%}
.fp .ring{fill:none;stroke:#fff;stroke-width:4;stroke-dasharray:352;stroke-dashoffset:352;transform:rotate(-90deg);transform-origin:60px 60px}
.fp.hold .ring{stroke-dashoffset:0;transition:stroke-dashoffset 1.4s linear}
.fp .print{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round}
.fp.hold{transform:scale(.95)}
#main{z-index:1}
.days{font-family:Caveat,cursive;font-size:30px;margin:6px 0 34px;color:#fff3f8}
.env{position:relative;width:min(80vw,300px);height:200px;cursor:pointer;filter:drop-shadow(0 18px 22px rgba(120,10,60,.4));animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.env div{position:absolute;inset:0;border-radius:8px}
.env .back{background:#ffe9f1}
.env .front{background:linear-gradient(135deg,#fff7fa,#ffd0e1);clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%)}
.env .flap{background:linear-gradient(#ffe3ee,#ffc2d8);clip-path:polygon(0 0,100% 0,50% 58%);transform-origin:top;transition:transform .8s,z-index 0s .4s;z-index:3}
.env .seal{inset:auto;left:50%;top:44%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:var(--rose);display:flex;align-items:center;justify-content:center;font-size:22px;z-index:4;transition:opacity .3s}
.env.open{animation:none}.env.open .flap{transform:rotateX(180deg);z-index:1}.env.open .seal{opacity:0}
.letter{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 16px 20px;background:rgba(120,10,60,.45);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .8s}
.letter.show{opacity:1;pointer-events:auto}
.paper{background:var(--cream);color:var(--ink);width:100%;max-width:420px;max-height:86vh;overflow:auto;border-radius:14px;padding:28px 24px;box-shadow:0 20px 60px rgba(90,0,40,.45);transform:translateY(40px) scale(.94);transition:transform .9s;-webkit-user-select:text;user-select:text;-webkit-overflow-scrolling:touch}
.letter.show .paper{transform:none}
.paper h2{font-family:Caveat,cursive;font-size:38px;margin:0 0 12px;color:var(--rose)}
.paper p{font-family:Caveat,"Segoe Script",cursive;font-size:25px;line-height:1.3;margin:0 0 12px;opacity:0;transform:translateY(10px);transition:all .8s}
.paper p.in{opacity:1;transform:none}
.sign{text-align:right;color:var(--rose)}
.pics{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:20px 0 6px}
.pic{background:#fff;padding:8px 8px 22px;box-shadow:0 6px 16px rgba(90,0,40,.25);width:46%;min-width:130px;transform:rotate(var(--r));opacity:0;transition:opacity 1s}
.pic.in{opacity:1}.pic img{width:100%;display:block}
#mus{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;z-index:9;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.35);color:#fff;font-size:20px;display:none}
.bokeh{position:fixed;border-radius:50%;background:rgba(255,255,255,.16);pointer-events:none;animation:float 7s ease-in-out infinite}
.side{display:none}.hd{display:none}
@media (min-width:900px){
h1{font-size:68px}.script{font-size:42px}.days{font-size:40px}.hint{font-size:18px}
.env{width:400px;height:266px}.env .seal{width:60px;height:60px;margin:-30px 0 0 -30px;font-size:30px}
.fp{width:190px;height:190px}.fp:hover{box-shadow:0 0 60px rgba(255,255,255,.8)}
.paper{max-width:760px;padding:46px 54px}.paper p{font-size:30px}.paper h2{font-size:50px}
.pic{width:30%}
.side{display:block;position:fixed;top:50%;width:230px;background:#fff;padding:10px 10px 30px;box-shadow:0 14px 34px rgba(120,10,60,.4);z-index:1;transform:translateY(-50%) rotate(var(--r))}
.side img{width:100%;display:block}
.hd{display:inline}.hm{display:none}}
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none}
.paper,.paper *{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
.fp{-webkit-appearance:none;appearance:none;outline:none}
</style>
</head>
<body>
<button id="mus" aria-label="Музыка">♪</button>

<section class="screen" id="gate">
  <div class="script">для самой любимой</div>
  <h1>У меня для тебя сюрприз</h1>
  <button class="fp" id="fp" aria-label="Приложи палец">
    <svg viewBox="0 0 120 120"><circle class="ring" cx="60" cy="60" r="56"/>
      <path class="print" d="M38 84V60a22 22 0 0 1 44 0v8M48 92V60a12 12 0 0 1 24 0v16q0 10-6 18M58 98V60M28 72V58a32 32 0 0 1 64 0v8M90 78v6"/></svg>
  </button>
  <div class="hint"><span class="hm">приложи палец и удерживай</span><span class="hd">нажми на кнопку и подержи</span></div>
</section>

<section class="screen hide" id="main">
  <div class="script">для Полины</div>
  <h1>Нам с тобой полгода</h1>
  <div class="days" id="days"></div>
  <div class="env" id="env"><div class="back"></div><div class="front"></div><div class="flap"></div><div class="seal">♥</div></div>
  <div class="hint">нажми на конверт</div>
</section>

<section class="letter" id="letter"><div class="paper" id="paper"></div></section>

const $=id=>document.getElementById(id);
const n=Math.floor((Date.now()-new Date(CFG.start))/864e5);
if(n>0)$("days").textContent="уже "+n+" дней вместе ♥";

const E=["♥","♥","🌸","🍬","🐾","🌷"];
setInterval(()=>{const h=document.createElement("div");h.className="fl";h.textContent=E[Math.random()*E.length|0];
h.style.left=Math.random()*100+"vw";h.style.fontSize=14+Math.random()*20+"px";h.style.animationDuration=6+Math.random()*6+"s";
document.body.appendChild(h);setTimeout(()=>h.remove(),12500)},450);

/* музыкальная шкатулка: мелодия создаётся прямо в браузере */
let ac,gain,on=false,timer;
const M=[[60,64,67,72],[57,64,69,72],[53,60,65,69],[55,62,67,71]];
const ML=[[79,0,76,0,72,0,76,0],[81,0,0,0,79,0,76,0],[77,0,81,0,84,0,81,0],[83,0,79,0,74,0,79,0]];
const AR=[0,1,2,3,2,1,2,1],S=0.42;
function note(m,t,v){const f=440*Math.pow(2,(m-69)/12);
 [1,2.01].forEach((k,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.value=f*k;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v/(i+1.6),t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+1.6);
 o.connect(g);g.connect(gain);o.start(t);o.stop(t+1.7)})}
function loop(t0){M.forEach((c,ci)=>{for(let s=0;s<8;s++){const t=t0+(ci*8+s)*S;
 note(c[AR[s]]-(s%2?0:0),t,.35);if(ML[ci][s])note(ML[ci][s],t,.5)}});
 timer=setTimeout(()=>{if(on)loop(t0+32*S)},(32*S-1)*1000)}
function music(){if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();gain=ac.createGain();gain.gain.value=.22;gain.connect(ac.destination)}
 ac.resume();on=true;clearTimeout(timer);loop(ac.currentTime+.1);$("mus").style.display="block"}
$("mus").onclick=()=>{if(on){on=false;clearTimeout(timer);gain.gain.setTargetAtTime(0,ac.currentTime,.2);$("mus").style.opacity=.5}
 else{gain.gain.value=.22;music();$("mus").style.opacity=1}};

document.addEventListener("selectstart",e=>{const n=e.target.nodeType===3?e.target.parentElement:e.target;if(!n||!n.closest(".paper"))e.preventDefault()});
const fp=$("fp");let tm;
fp.addEventListener("pointerdown",e=>{e.preventDefault();fp.classList.add("hold");if(navigator.vibrate)navigator.vibrate(30);
 try{music()}catch(x){}
 tm=setTimeout(()=>{if(navigator.vibrate)navigator.vibrate([60,40,90]);$("gate").classList.add("hide");$("main").classList.remove("hide")},1400)});
["pointerup","pointerleave","pointercancel"].forEach(ev=>fp.addEventListener(ev,()=>{clearTimeout(tm);fp.classList.remove("hold")}));
const blockTouch=e=>e.preventDefault();
$("gate").addEventListener("touchstart",blockTouch,{passive:false});
["touchend","pointerup"].forEach(ev=>fp.addEventListener(ev,()=>{if(ac)ac.resume()}));
document.addEventListener("selectstart",e=>{const n=e.target.nodeType===3?e.target.parentElement:e.target;if(!n||!n.closest(".paper"))e.preventDefault()});
document.addEventListener("contextmenu",e=>{if(!e.target.closest||!e.target.closest(".paper"))e.preventDefault()});
fp.addEventListener("contextmenu",e=>e.preventDefault());

let h='<h2>Мой любимый заяц,</h2>'+CFG.letter.map(t=>"<p>"+t+"</p>").join("");
if(CFG.photos.length)h+='<div class="pics">'+CFG.photos.map((p,i)=>'<div class="pic" style="--r:'+(i%2?3:-3)+'deg"><img src="'+p+'" alt=""></div>').join("")+"</div>";
h+='<p class="sign">'+CFG.sign+"</p>";$("paper").innerHTML=h;
$("env").addEventListener("click",()=>{$("env").classList.add("open");setTimeout(()=>{$("letter").classList.add("show");
 const ps=document.querySelectorAll(".paper p");ps.forEach((p,i)=>setTimeout(()=>p.classList.add("in"),700+i*1000));
 document.querySelectorAll(".pic").forEach((p,i)=>setTimeout(()=>p.classList.add("in"),700+ps.length*1000+i*500))},900)});

for(let i=0;i<9;i++){const b=document.createElement("div");b.className="bokeh";const s=40+Math.random()*130;
b.style.cssText="width:"+s+"px;height:"+s+"px;left:"+Math.random()*100+"vw;top:"+Math.random()*100+"vh;animation-delay:-"+Math.random()*7+"s";document.body.prepend(b)}
CFG.photos.slice(0,2).forEach((p,i)=>{const d=document.createElement("div");d.className="side";
d.style.cssText=(i?"right":"left")+":7vw;--r:"+(i?5:-6)+"deg";d.innerHTML='<img src="'+p+'" alt="">';$("main").appendChild(d)});
</script>
